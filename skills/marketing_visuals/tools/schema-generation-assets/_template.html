<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /*
       * === POPULATE FROM PROJECT'S visual-identity.md ===
       *
       * Read: ${PROJECT_PATH}/marketing/visual-identity.md
       * Use the Dark Mode palette (or Light Mode if specified)
       */

      /* Base colors - from "Base Colors (Dark Mode)" table */
      --bg: ;              /* Base 100 - Primary backgrounds */
      --bg-lighter: ;      /* Base 200 - Secondary backgrounds */
      --surface: ;         /* Base 200 - Cards, surfaces */
      --surface-border: ;  /* Base 300 - Borders, dividers */
      --muted: ;           /* Base 400 - Disabled, subtle */
      --foreground: ;      /* Title - Headings, primary text */
      --muted-fg: ;        /* Content - Body text, labels */

      /* Brand colors - from "Primary Colors (Dark Mode)" table */
      --primary: ;         /* Primary - Main brand color */
      --primary-glow: ;    /* rgba(primary RGB, 0.4) */
      --primary-dim: ;     /* rgba(primary RGB, 0.6) */
      --accent: ;          /* Accent - Highlights */
      --accent-content: ;  /* Accent Content - if defined */

      /* Semantic (if defined in visual-identity.md) */
      --success: ;
      --warning: ;
      --warning-dim: ;
      --error: ;
    }

    body {
      /* Set your canvas size here */
      width: 1200px;
      height: 630px;
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--foreground);
      padding: 48px;
    }

    /* === COMMON PATTERNS === */

    /* Card/Box */
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    /* Highlighted box (primary color) */
    .highlight-box {
      background: linear-gradient(135deg, var(--primary-dim) 0%, var(--primary-glow) 100%);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 16px;
    }

    .highlight-box .title {
      color: var(--primary);
      font-weight: 500;
    }

    .highlight-box .subtitle {
      color: var(--primary-dim);
      font-size: 12px;
    }

    /* Glowing element */
    .glow {
      box-shadow: 0 0 20px var(--primary-glow);
      border: 1px solid var(--primary);
    }

    /* Muted/disabled box */
    .muted-box {
      background: var(--bg-lighter);
      border: 1px solid var(--muted);
      border-radius: 8px;
      padding: 12px;
      color: var(--muted-fg);
    }

    /* Dashed border (for "adding" or placeholder states) */
    .dashed {
      border: 1px dashed var(--muted);
      opacity: 0.6;
    }

    /* Labels */
    .label {
      font-size: 12px;
      color: var(--muted-fg);
    }

    .label-primary {
      font-size: 12px;
      color: var(--primary);
      font-weight: 500;
    }

    /* Badge */
    .badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .badge-success {
      color: var(--success);
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-warning {
      color: var(--warning);
      background: var(--warning-dim);
      border: 1px solid var(--warning);
    }

    /* Title styles */
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted-fg);
    }

    /* Bullet list */
    .features-list {
      list-style: none;
    }

    .features-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted-fg);
    }

    .features-list .bullet {
      color: var(--primary);
      font-size: 8px;
      margin-top: 6px;
    }

    /* === SVG CONNECTIONS === */

    .connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .conn-line {
      stroke: var(--primary);
      stroke-width: 2;
      fill: none;
      filter: drop-shadow(0 0 4px var(--primary-glow));
    }

    .conn-line-muted {
      stroke: var(--muted-fg);
      stroke-width: 1.5;
      stroke-dasharray: 6,4;
      fill: none;
    }

    .conn-arrow {
      fill: var(--primary);
      filter: drop-shadow(0 0 4px var(--primary-glow));
    }
  </style>
</head>
<body>

</body>
</html>
